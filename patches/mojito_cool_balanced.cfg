# ==============================================================================
# Kernel Configuration Fragment: mojito_cool_balanced.cfg
# Optimasi: Adem, Ringan, Hemat Baterai untuk Redmi Note 10 4G (MIUI 14)
# ==============================================================================

# --- 1. PURGE DEBUGGING & TRACING OVERHEAD (MENGHEMAT SIKLUS CPU & BATERAI) ---
# Matikan compiler debug info agar ukuran kernel compact dan instruksi lebih cepat
CONFIG_DEBUG_INFO=n
CONFIG_FTRACE=n
CONFIG_FUNCTION_TRACER=n
CONFIG_STACK_TRACER=n
CONFIG_DYNAMIC_FTRACE=n
CONFIG_KALLSYMS_ALL=n
CONFIG_SLUB_DEBUG=n
CONFIG_PANIC_ON_OOPS=n
CONFIG_PAGE_OWNER=n
CONFIG_DEBUG_KMEMLEAK=n
CONFIG_DEBUG_PREEMPT=n
CONFIG_PROVE_LOCKING=n
CONFIG_LOCKDEP=n

# Pertahankan subsystem logging internal Qualcomm agar driver display AMOLED & kamera inisialisasi normal
CONFIG_MSM_RTB=y
CONFIG_MSM_DEBUG_LAR_MARKERS=n
CONFIG_IPC_LOGGING=y
CONFIG_MSM_COMMON_LOG=y

# Matikan in-kernel headers archive (menghemat RAM dan mempercepat build)
CONFIG_IKHEADERS=n

# --- 2. ZRAM COMPRESSION UPGRADE (RAM LEGA, RESPONSING CEPAT TANPA OVERHEAT) ---
CONFIG_ZRAM=y
CONFIG_ZRAM_WRITEBACK=y
CONFIG_CRYPTO_ZSTD=y
CONFIG_CRYPTO_LZ4=y
CONFIG_CRYPTO_LZ4HC=y
CONFIG_ZSMALLOC=y
CONFIG_ZSMALLOC_STAT=n

# --- 3. CPU FREQUENCY GOVERNOR & SCHEDUTIL EAS TUNING ---
# Default governor menggunakan Schedutil yang terintegrasi langsung dengan Energy Model (EAS)
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_ENERGY_MODEL=y
CONFIG_CPU_IDLE=y
CONFIG_ARM_CPUIDLE=y

# --- 4. I/O SCHEDULER UNTUK STORAGE UFS 2.2 ---
# Gunakan mq-deadline / none untuk low latency dan meminimalisir read-write queuing
CONFIG_MQ_IOSCHED_DEADLINE=y
CONFIG_DEFAULT_MQ_DEADLINE=y

# --- 5. THERMAL PACING & SENSOR COMPATIBILITY (MIUI 14) ---
CONFIG_THERMAL_GOV_STEP_WISE=y
CONFIG_THERMAL_GOV_USER_SPACE=y
CONFIG_QTI_CPU_ISOLATE_COOLING_DEVICE=y
